name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        default: v1.0.0
      build:
        description: "Build type"
        required: true
        type: choice
        default: "NonKSU"
        options:
          - NonKSU
          - KSU
    push:
      branches: 
        - yoka_stock
    pull_request_target:
      branches: 
        - yoka_stock

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARCH: arm64
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        if: inputs.build == 'KSU'
        run: git submodule update --init --recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python3-pip ninja-build zip
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          ./prepare_compiler.sh
      - name: Build NonKSU kernel and log output
        if: inputs.build == 'NonKSU'
        run: |
          mkdir -p out
          make O=out ARCH=$ARCH CC=$CC blossom_defconfig 
          ./clang.sh | tee build.log
      - name: Build KSU kernel and log output
        if: inputs.build == 'KSU'
        run: |
          mkdir -p out
          chmod +x ksu/applyPatches.sh
          ./ksu/applyPatches.sh
          make O=out ARCH=$ARCH CC=$CC ksu_defconfig
          ./clang.sh | tee build.log
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/mediatek/mt6765.dtb
            build.log
